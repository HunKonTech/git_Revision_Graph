# Shared plugin metadata (mirrors vscode/package.json +
# vs/source.extension.vsixmanifest). Gradle only reads gradle.properties from
# the root project dir; platform version, plugin name, and since/until build
# live in intellij/build.gradle.kts instead — only the group and the version
# (patched by CI on release) are common enough to sit here.
pluginGroup=com.hunkontech.revgraph
pluginVersion=0.1.0

org.gradle.jvmargs=-Xmx2g
kotlin.stdlib.default.dependency=false
