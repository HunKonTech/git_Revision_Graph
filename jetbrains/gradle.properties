# Shared plugin metadata for BOTH flavors (mirrors vscode/package.json +
# vs/source.extension.vsixmanifest). Gradle only reads gradle.properties from
# the root project dir, so anything a flavor overrides (platform version,
# plugin name, since/until build) lives in that flavor's own build.gradle.kts
# instead — only the group and the version (patched by CI on release) are
# common enough to sit here.
pluginGroup=com.hunkontech.revgraph
# Separate plugin id for the DevEco Studio flavor: the JetBrains Marketplace
# is one id-per-listing, so it needs its own id distinct from :intellij's
# pluginGroup even though both are published there.
pluginGroupDeveco=com.hunkontech.revgraph.deveco
# Separate plugin id for the Android Studio flavor, for the same reason: its
# Marketplace listing is distinct from :intellij's and :deveco's.
pluginGroupAndroidStudio=com.hunkontech.revgraph.androidstudio
pluginVersion=0.1.0

org.gradle.jvmargs=-Xmx2g
kotlin.stdlib.default.dependency=false
