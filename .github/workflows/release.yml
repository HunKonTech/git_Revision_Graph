name: Build & Publish Extensions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write   # GitHub Release létrehozása

jobs:
  release:
    runs-on: [self-hosted, Windows]

    outputs:
      new_version: ${{ steps.ver.outputs.NEW_VERSION }}

    env:
      CURRENT_VERSION: ${{ vars.EXTENSION_VERSION }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Forrás
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Verzió kiszámítása
      # -----------------------------------------------------------------------
      - name: Compute new version
        id: ver
        shell: powershell
        run: |
          $cur = "$env:CURRENT_VERSION"
          if (-not $cur -or $cur -eq '') { $cur = '1.0.0' }

          $parts = $cur -split '\.'
          $major = [int]$parts[0]; $minor = [int]$parts[1]; $patch = [int]$parts[2]

          $bump = if ('${{ inputs.bump }}') { '${{ inputs.bump }}' } else { 'patch' }
          switch ($bump) {
            'major' { $major++; $minor = 0; $patch = 0 }
            'minor' { $minor++;             $patch = 0 }
            'patch' { $patch++ }
          }
          $new = "$major.$minor.$patch"
          Write-Host "Version: $cur -> $new"
          "NEW_VERSION=$new" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "NEW_VERSION=$new" | Out-File -FilePath $env:GITHUB_ENV    -Append

      # -----------------------------------------------------------------------
      # 2b. EXTENSION_VERSION repo változó frissítése AZONNAL.
      #     Így ha bármelyik későbbi (build/publish) lépés elhasal, a következő
      #     futás már az új verziószámmal indul, és nem ragad be ugyanazon a
      #     "v... already exists" hibán.
      # -----------------------------------------------------------------------
      - name: Bump EXTENSION_VERSION repo variable (early)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $v = $env:NEW_VERSION

          if (-not $env:GH_TOKEN) {
            Write-Warning "GH_PAT secret is empty - cannot persist EXTENSION_VERSION."
            Write-Warning "Create a fine-grained PAT (Variables: Read and write) and save it as the GH_PAT secret."
            Write-Warning "Continuing the build; the version will NOT advance until GH_PAT is set."
            exit 0
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github.v3+json"
          }
          $body = [ordered]@{
            name  = "EXTENSION_VERSION"
            value = $v
          } | ConvertTo-Json

          # Don't let a token/permission problem kill the whole build — warn and continue.
          try {
            Invoke-RestMethod -Method Patch `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/variables/EXTENSION_VERSION" `
              -Headers $headers `
              -Body $body `
              -ContentType "application/json" | Out-Null
            Write-Host "EXTENSION_VERSION -> $v (bumped before build/publish)"
          } catch {
            Write-Warning "Failed to update EXTENSION_VERSION variable: $($_.Exception.Message)"
            Write-Warning "Check that GH_PAT has 'Variables: Read and write' permission on this repo."
            Write-Warning "Continuing the build; the version will NOT advance this run."
          }

      # -----------------------------------------------------------------------
      # 3. Verzió beírása a forrásba (build előtt)
      # -----------------------------------------------------------------------
      - name: Patch versions in source files
        shell: powershell
        run: |
          $v = $env:NEW_VERSION
          $pattern     = '"version":\s*"[^"]*"'
          $replacement = '"version": "' + $v + '"'

          # root package.json
          $f = 'package.json'
          (Get-Content $f -Raw) -replace $pattern, $replacement | Set-Content $f -NoNewline

          # vscode/package.json
          $f = 'vscode/package.json'
          (Get-Content $f -Raw) -replace $pattern, $replacement | Set-Content $f -NoNewline

          # vs/source.extension.vsixmanifest (XML attribute)
          # PS 5.1 reads BOM-less files using the system codepage, not UTF-8 -
          # since the Description contains an em dash (U+2014), a plain
          # Get-Content/Save round-trip mangles it into "â€”" on save (same
          # class of bug fixed for build-installers.ps1 below). Read as UTF-8
          # explicitly to avoid corrupting the manifest text.
          $manifestPath = (Resolve-Path 'vs/source.extension.vsixmanifest').Path
          $manifestText = [System.IO.File]::ReadAllText($manifestPath, [System.Text.Encoding]::UTF8)
          $xml = [xml]$manifestText
          $xml.PackageManifest.Metadata.Identity.Version = $v
          $xml.Save($manifestPath)

          # jetbrains/gradle.properties (pluginVersion=..., shared by all flavors)
          $f = 'jetbrains/gradle.properties'
          (Get-Content $f -Raw) -replace 'pluginVersion=.*', "pluginVersion=$v" | Set-Content $f -NoNewline

          # netbeans/pom.xml (project <version> — the module code-name base
          # stays fixed; only the version is bumped). The dedicated
          # build-netbeans-plugin job re-patches its own fresh checkout via
          # versions:set; this keeps the build-installers.ps1 path (run in this
          # job) producing a correctly-versioned .nbm too.
          $nbPom = (Resolve-Path 'netbeans/pom.xml').Path
          $nbXml = [xml](Get-Content $nbPom -Raw)
          $nbXml.project.version = $v
          $nbXml.Save($nbPom)

          Write-Host "Patched all version strings to $v"

      # -----------------------------------------------------------------------
      # 4. Node.js
      # -----------------------------------------------------------------------
      # No `cache: 'npm'`: on this self-hosted runner the cache restore fails
      # ("tar (child): gzip: Cannot exec" — Git's usr/bin isn't on PATH), so it
      # never restores and just wastes a ~71 MB download every run.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -----------------------------------------------------------------------
      # 5. Build
      #    A meglévő scripts/build-installers.ps1 elvégzi az npm install-t,
      #    a shared renderer buildet, a VS Code .vsix-eket és a VS VSIX-et.
      # -----------------------------------------------------------------------
      - name: Build all extensions
        shell: powershell
        run: |
          # PS 5.1 reads BOM-less UTF-8 files as Windows-1252.
          # The em dash (U+2014, UTF-8: E2 80 94) has 0x94 as its 3rd byte,
          # which Windows-1252 maps to the right curly quote (U+201D).
          # PowerShell treats U+201D as a string terminator, breaking the parser.
          # Fix: re-write the script with a UTF-8 BOM so PS 5.1 reads it correctly.
          $scriptPath = (Resolve-Path 'scripts\build-installers.ps1').Path
          $content    = [System.IO.File]::ReadAllText($scriptPath, [System.Text.Encoding]::UTF8)
          $utf8bom    = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText($scriptPath, $content, $utf8bom)
          & $scriptPath

      - name: List artifacts
        shell: powershell
        run: |
          Write-Host "=== dist/installers/ ==="
          Get-ChildItem dist/installers/*.vsix |
            Format-Table Name, @{L='KB'; E={[math]::Round($_.Length/1KB, 1)}}

      # -----------------------------------------------------------------------
      # 6. GitHub Release
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $v   = $env:NEW_VERSION
          $tag = "v$v"

          $notes = @(
            "## Git Revision Graph $v",
            "",
            "### Packages",
            "| File | Description |",
            "|------|-------------|",
            "| rev-graph-vscode-$v.vsix | VS Code (engine ^1.85) |",
            "| RevisionGraph-vs2022.vsix | Visual Studio 2022 extension |",
            "| RevisionGraph-vs2026.vsix | Visual Studio 2026 extension |",
            "| RevisionGraph-jetbrains.zip | JetBrains IDEs plugin - IntelliJ IDEA, Android Studio, DevEco Studio, WebStorm, PyCharm, etc. (sideload, and JetBrains Marketplace) |",
            "| RevisionGraph-netbeans.nbm | Apache NetBeans plugin (sideload, or auto-update via the NetBeans Update Center below) |",
            "",
            "### Marketplace listings",
            "- [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=BenKoncsik.rev-graph-vscode)",
            "- [Visual Studio Marketplace (2022 / 2026)](https://marketplace.visualstudio.com/items?itemName=BenKoncsik.GitRevisionGraph)",
            "- [JetBrains Marketplace](https://plugins.jetbrains.com/plugin/32627-revision-graph-for-git-svn-style-)",
            "",
            "### Auto-update centers",
            "- NetBeans auto-update (Tools > Plugins > Settings > Add): https://hunkontech.github.io/git_Revision_Graph/netbeans-update-center/updates.xml",
            "- Eclipse update site (Help > Install New Software): https://hunkontech.github.io/git_Revision_Graph/eclipse-update-site/"
          ) -join "`n"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github.v3+json"
          }

          # 1. Get existing release for this tag, or create a new one
          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" `
              -Headers $headers
            Write-Host "Using existing release: $($release.html_url)"
          } catch {}

          if (-not $release) {
            $releaseJson = [ordered]@{
              tag_name   = $tag
              name       = "v$v"
              body       = $notes
              draft      = $false
              prerelease = $false
            } | ConvertTo-Json

            $release = Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
              -Headers $headers `
              -Body $releaseJson `
              -ContentType "application/json"

            Write-Host "Release created: $($release.html_url)"
          }

          # 2. Upload each VSIX asset (delete existing asset with same name first)
          $uploadBase = $release.upload_url -replace '\{.*\}', ''
          foreach ($assetPath in (Get-ChildItem dist/installers/*.vsix).FullName) {
            $name  = Split-Path $assetPath -Leaf

            $existing = $release.assets | Where-Object { $_.name -eq $name }
            if ($existing) {
              Invoke-RestMethod -Method Delete `
                -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($existing.id)" `
                -Headers $headers | Out-Null
              Write-Host "Removed old asset: $name"
            }

            $bytes = [System.IO.File]::ReadAllBytes($assetPath)
            Invoke-RestMethod -Method Post `
              -Uri ($uploadBase + "?name=$name") `
              -Headers $headers `
              -Body $bytes `
              -ContentType "application/octet-stream" | Out-Null
            Write-Host "Uploaded: $name"
          }

      # -----------------------------------------------------------------------
      # 7. VS Code Marketplace — stable
      # -----------------------------------------------------------------------
      - name: Publish VS Code extension (stable)
        shell: powershell
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          $vsix = Get-ChildItem dist/installers/rev-graph-vscode-*.vsix |
                  Where-Object { $_.Name -notmatch 'vs2026' } |
                  Select-Object -First 1
          if (-not $vsix) {
            Write-Warning "VS Code stable VSIX not found - skipping."
            exit 0
          }
          Write-Host "Publishing: $($vsix.Name)"
          npx --yes @vscode/vsce publish `
            --pat "$env:VSCE_PAT" `
            --packagePath "$($vsix.FullName)"

      # -----------------------------------------------------------------------
      # 8. Visual Studio Marketplace (VsixPublisher.exe)
      # -----------------------------------------------------------------------
      - name: Publish Visual Studio extension
        shell: powershell
        env:
          VS_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Warning "vswhere.exe not found - skipping VS Marketplace publish."
            exit 0
          }

          # Find VsixPublisher.exe (prefer VS 2026, fall back to VS 2022)
          $vsixPublisher = $null
          foreach ($spec in @(
              @{ Range = '[18.0,19.0)'; Pre = $true  },
              @{ Range = '[17.0,18.0)'; Pre = $false }
          )) {
            $args = @(
              '-version',  $spec.Range,
              '-latest',
              '-requires', 'Microsoft.VisualStudio.Workload.VisualStudioExtension',
              '-property',  'installationPath'
            )
            if ($spec.Pre) { $args += '-prerelease' }
            $path = & $vswhere @args 2>$null
            if ($path) {
              $candidate = Join-Path $path 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
              if (Test-Path $candidate) { $vsixPublisher = $candidate; break }
            }
          }

          if (-not $vsixPublisher) {
            Write-Warning "VsixPublisher.exe not found - skipping VS Marketplace publish."
            Write-Warning "Ensure the VS Extension Development workload is installed on this runner."
            exit 0
          }
          Write-Host "VsixPublisher: $vsixPublisher"

          # VSIX to publish (prefer vs2026, fall back to vs2022)
          $vsix = Get-ChildItem `
              dist/installers/RevisionGraph-vs2026.vsix,
              dist/installers/RevisionGraph-vs2022.vsix `
              -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $vsix) {
            Write-Warning "Visual Studio VSIX not found - skipping."
            exit 0
          }
          Write-Host "Publishing VS extension: $($vsix.Name)"

          & $vsixPublisher publish `
            -payload       "$($vsix.FullName)" `
            -publishManifest 'vs/publishManifest.json' `
            -personalAccessToken "$env:VS_PAT"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "VsixPublisher.exe exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Successfully published to Visual Studio Marketplace."

  # -------------------------------------------------------------------------
  # Second job: build VS 2022 VSIX on the self-hosted Windows runner.
  # Runs after the release job so the GitHub Release already exists.
  # Uses Microsoft.VSSDK.BuildTools (NuGet) — no workload install needed.
  # -------------------------------------------------------------------------
  build-vs-vsix:
    needs: release
    runs-on: [self-hosted, Windows]
    if: success() || needs.release.result == 'success'

    env:
      NEW_VERSION: ${{ needs.release.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Verzio beírása a VS manifestbe
      # -----------------------------------------------------------------------
      - name: Patch version in VS manifest
        shell: powershell
        run: |
          $v = $env:NEW_VERSION
          $pattern     = '"version":\s*"[^"]*"'
          $replacement = '"version": "' + $v + '"'
          $f = 'package.json'
          (Get-Content $f -Raw) -replace $pattern, $replacement | Set-Content $f -NoNewline
          # Read as UTF-8 explicitly - see comment on the same pattern in the
          # "Patch versions in source files" step above.
          $manifestPath = (Resolve-Path 'vs/source.extension.vsixmanifest').Path
          $manifestText = [System.IO.File]::ReadAllText($manifestPath, [System.Text.Encoding]::UTF8)
          $xml = [xml]$manifestText
          $xml.PackageManifest.Metadata.Identity.Version = $v
          $xml.Save($manifestPath)
          Write-Host "Patched VS manifest to $v"

      # -----------------------------------------------------------------------
      # 2. Node + web asset build (szükséges a VS extension webview-hoz)
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets for VS
        shell: powershell
        run: |
          npm install
          # A copy-vs-assets a graph-webview/dist-ből másol, ezért előbb fel kell
          # építeni a shared renderert (core + webview), különben ENOENT.
          npm run build:core
          npm run build:webview
          npm run build:vs-assets

      # -----------------------------------------------------------------------
      # 3. VS 2022 VSIX build MSBuild-del
      #    Microsoft.VSSDK.BuildTools NuGet-csomagot a /t:Restore visszallitja,
      #    igy nem kell az Extension development workload.
      # -----------------------------------------------------------------------
      - name: Build VS 2022 VSIX
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Warning "vswhere.exe not found - skipping."
            exit 0
          }
          # A VSIX-et a Microsoft.VSSDK.BuildTools NuGet buildeli, ezért bármelyik
          # MSBuild jó (a manifest install-target [17.0,19.0) VS 2022 + VS 2026).
          # A runner image VS 2022-t VAGY VS 2026-ot tartalmazhat, ezért tág a
          # tartomány és a -prerelease is kell (a VS 2026 prerelease-ként jelölt).
          $path = & $vswhere -version "[17.0,19.0)" -latest -prerelease `
            -requires Microsoft.Component.MSBuild `
            -property installationPath
          if (-not $path) {
            Write-Warning "No Visual Studio with MSBuild found - skipping."
            exit 0
          }
          $msbuild = Join-Path $path "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            Write-Warning "MSBuild.exe not found at $msbuild - skipping."
            exit 0
          }
          Write-Host "MSBuild: $msbuild"
          # Two-pass build: Restore must complete in its own invocation so that the
          # NuGet-generated obj\*.nuget.g.targets (which contains the VSSDK
          # CreateVsixContainer target) is written to disk before the project is
          # re-evaluated for the actual Rebuild.  A single /t:Restore,Rebuild call
          # evaluates the project before restore runs, so the VSIX target is never
          # imported and the .vsix file is never produced.
          & $msbuild vs\RevisionGraph.csproj /t:Restore /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild Restore failed ($LASTEXITCODE)" }
          & $msbuild vs\RevisionGraph.csproj `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:DeployExtension=false `
            /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild Rebuild failed ($LASTEXITCODE)" }
          $built = "vs\bin\Release\RevisionGraph.vsix"
          if (-not (Test-Path $built)) {
            Write-Warning "VSIX not found at $built after build."
            exit 0
          }
          New-Item -ItemType Directory -Force "dist\installers" | Out-Null
          Copy-Item $built "dist\installers\RevisionGraph-vs2022.vsix" -Force
          Write-Host "VS 2022 VSIX ready."

      # -----------------------------------------------------------------------
      # 4. Feltoltes a mar meglevo GitHub Release-be
      # -----------------------------------------------------------------------
      - name: Upload VS 2022 VSIX to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $vsixPath = "dist\installers\RevisionGraph-vs2022.vsix"
          if (-not (Test-Path $vsixPath)) {
            Write-Warning "RevisionGraph-vs2022.vsix not found - skipping upload."
            exit 0
          }
          $v   = $env:NEW_VERSION
          $tag = "v$v"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github.v3+json"
          }
          $release = Invoke-RestMethod -Method Get `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" `
            -Headers $headers
          $uploadBase = $release.upload_url -replace '\{.*\}', ''
          $name = "RevisionGraph-vs2022.vsix"
          $existing = $release.assets | Where-Object { $_.name -eq $name }
          if ($existing) {
            Invoke-RestMethod -Method Delete `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($existing.id)" `
              -Headers $headers | Out-Null
            Write-Host "Removed old asset: $name"
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $vsixPath).Path)
          Invoke-RestMethod -Method Post `
            -Uri ($uploadBase + "?name=$name") `
            -Headers $headers `
            -Body $bytes `
            -ContentType "application/octet-stream" | Out-Null
          Write-Host "Uploaded: $name"

      # -----------------------------------------------------------------------
      # 5. Visual Studio Marketplace publish
      #    VsixPublisher.exe is part of the VS Extension Development workload.
      #    The windows-2025-vs2026 runner ships VS 2026 Enterprise which
      #    includes it; search without a workload constraint so the path check
      #    is the real gate.
      # -----------------------------------------------------------------------
      - name: Publish Visual Studio extension to Marketplace
        shell: powershell
        env:
          VS_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:VS_PAT) {
            Write-Warning "VS_MARKETPLACE_PAT secret is empty - skipping publish."
            exit 0
          }
          $vsixPath = "dist\installers\RevisionGraph-vs2022.vsix"
          if (-not (Test-Path $vsixPath)) {
            Write-Warning "VSIX not found - skipping publish."
            exit 0
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Warning "vswhere.exe not found - skipping publish."
            exit 0
          }
          # Search any VS 17-18 installation; VsixPublisher lives under VSSDK\
          # regardless of the exact workload set.
          $vsixPublisher = $null
          foreach ($spec in @(
            @{ Range = '[18.0,19.0)'; Pre = $true  },
            @{ Range = '[17.0,18.0)'; Pre = $false }
          )) {
            $vsArgs = @('-version', $spec.Range, '-latest', '-requires', 'Microsoft.Component.MSBuild', '-property', 'installationPath')
            if ($spec.Pre) { $vsArgs += '-prerelease' }
            $installPath = & $vswhere @vsArgs 2>$null
            if ($installPath) {
              $candidate = Join-Path $installPath 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
              if (Test-Path $candidate) { $vsixPublisher = $candidate; break }
            }
          }
          if (-not $vsixPublisher) {
            Write-Warning "VsixPublisher.exe not found - skipping VS Marketplace publish."
            Write-Warning "Install the 'Visual Studio extension development' workload on this runner."
            exit 0
          }
          Write-Host "VsixPublisher: $vsixPublisher"
          & $vsixPublisher publish `
            -payload       (Resolve-Path $vsixPath).Path `
            -publishManifest (Resolve-Path 'vs\publishManifest.json').Path `
            -personalAccessToken "$env:VS_PAT"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "VsixPublisher.exe exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Successfully published to Visual Studio Marketplace."

  # -------------------------------------------------------------------------
  # Third job: build the JetBrains-family plugin (IntelliJ Platform / Gradle).
  # ONE multi-project (jetbrains/) produces ONE distribution (:intellij) from
  # the shared codebase, built against a broad build-number range so the same
  # ZIP installs in IntelliJ IDEA, Android Studio, Huawei DevEco Studio, and
  # every other IntelliJ Platform IDE — no per-product flavors needed, since
  # Marketplace/IDE compatibility is matched by build number, not product name.
  # Independent of the VS VSIX job — runs in parallel, also after `release` so
  # the GitHub Release already exists. Ships as a sideloadable ZIP AND is
  # published to the JetBrains Marketplace when the JETBRAINS_MARKETPLACE_TOKEN
  # secret is set (the publish step is skipped otherwise, so CI still succeeds
  # without it). One plugin id/listing (see pluginGroup in
  # jetbrains/gradle.properties).
  # -------------------------------------------------------------------------
  build-jetbrains-plugins:
    needs: release
    runs-on: [self-hosted, Windows]
    if: success() || needs.release.result == 'success'

    env:
      NEW_VERSION: ${{ needs.release.outputs.new_version }}
      # Inherited by the publish step below. Empty when the secret is unset,
      # which both skips that step (its `if`) and makes Gradle's publishPlugin a
      # no-op — so builds without credentials still succeed.
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch version in jetbrains/gradle.properties
        shell: powershell
        run: |
          $v = $env:NEW_VERSION
          $f = 'jetbrains/gradle.properties'
          (Get-Content $f -Raw) -replace 'pluginVersion=.*', "pluginVersion=$v" | Set-Content $f -NoNewline
          Write-Host "Patched jetbrains/gradle.properties to $v"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build shared web assets for the JetBrains plugins
        shell: powershell
        run: |
          npm install
          npm run build:core
          npm run build:webview
          npm run build:jetbrains-assets

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the JetBrains plugin
        shell: powershell
        working-directory: jetbrains
        run: |
          # One subproject (:intellij), one build — installable across the
          # whole IntelliJ Platform family (IntelliJ IDEA, Android Studio,
          # DevEco Studio, WebStorm, PyCharm, ...) via its build-number range.
          gradle buildPlugin --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle buildPlugin failed ($LASTEXITCODE)" }

      - name: Copy plugin ZIP to dist/installers
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "dist\installers" | Out-Null
          $zip = Get-ChildItem "jetbrains\intellij\build\distributions\*.zip" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw "No JetBrains plugin ZIP found under jetbrains\intellij\build\distributions\" }
          Copy-Item $zip.FullName "dist\installers\RevisionGraph-jetbrains.zip" -Force
          Write-Host "JetBrains plugin ready -> RevisionGraph-jetbrains.zip"

      - name: Upload JetBrains plugin to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $v   = $env:NEW_VERSION
          $tag = "v$v"
          $name = "RevisionGraph-jetbrains.zip"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github.v3+json"
          }
          $release = Invoke-RestMethod -Method Get `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" `
            -Headers $headers
          $uploadBase = $release.upload_url -replace '\{.*\}', ''
          $zipPath = "dist\installers\$name"
          $existing = $release.assets | Where-Object { $_.name -eq $name }
          if ($existing) {
            Invoke-RestMethod -Method Delete `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($existing.id)" `
              -Headers $headers | Out-Null
            Write-Host "Removed old asset: $name"
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $zipPath).Path)
          Invoke-RestMethod -Method Post `
            -Uri ($uploadBase + "?name=$name") `
            -Headers $headers `
            -Body $bytes `
            -ContentType "application/octet-stream" | Out-Null
          Write-Host "Uploaded: $name"

      # -----------------------------------------------------------------------
      # Publish to the JetBrains Marketplace.
      # Only runs when the JETBRAINS_MARKETPLACE_TOKEN secret is present (the
      # `if` guards on the job-level PUBLISH_TOKEN env, which is empty otherwise).
      # Signing env vars are optional — if the CERTIFICATE_CHAIN / PRIVATE_KEY
      # secrets are unset, the Marketplace signs the upload itself. One listing
      # (`com.hunkontech.revgraph` — see pluginGroup in jetbrains/gradle.properties)
      # must be created once via the web UI + approved before the API can push
      # updates to it.
      #
      # RETRY-SAFE: this whole job can legitimately be re-run without a version
      # bump — e.g. GitHub Actions' "Re-run failed jobs" re-executes only this
      # job while reusing the `release` job's already-computed NEW_VERSION, so a
      # retry after a partial failure targets the exact same version again. The
      # Marketplace API is not idempotent for either of two cases that then
      # occur, so both are downgraded from a thrown error to a warning here
      # (the job stays green; the ZIP is already built and attached to the
      # GitHub Release above regardless):
      #   - "Cannot find plugin"                — the listing doesn't exist yet
      #     (one-time bootstrap: create it once via https://plugins.jetbrains.com/
      #     and let it clear moderation; every later run publishes normally).
      #   - "already contains version ... in channel" — this exact version was
      #     already published by an earlier attempt of the same job; there is
      #     nothing left to do.
      # Any OTHER publish failure still fails the job.
      # -----------------------------------------------------------------------
      - name: Publish to JetBrains Marketplace
        if: ${{ env.PUBLISH_TOKEN != '' }}
        shell: powershell
        working-directory: jetbrains
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          gradle :intellij:publishPlugin --no-daemon 2>&1 | Tee-Object -Variable captured | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            if ($captured -match 'Cannot find plugin') {
              Write-Warning "Plugin is not on the JetBrains Marketplace yet. Upload the first com.hunkontech.revgraph build manually via https://plugins.jetbrains.com/ and let it clear moderation; CI will publish updates automatically after that. Treating this one-time bootstrap failure as non-fatal."
            } elseif ($captured -match 'already contains version .* in channel') {
              Write-Warning "This version is already published (likely a retry of this job at the same NEW_VERSION). Nothing to do."
            } else {
              throw "Gradle publishPlugin failed ($LASTEXITCODE)"
            }
          } else {
            Write-Host "Published to the JetBrains Marketplace."
          }

  # -------------------------------------------------------------------------
  # Fifth host: build & publish the Eclipse plugin (Eclipse Tycho / Maven).
  # ONE Tycho reactor (eclipse/pom.xml) produces the OSGi plugin, an installable
  # feature, and a p2 update site (+ zip). Independent of the VS VSIX and
  # JetBrains jobs — runs in parallel, also after `release` so the GitHub
  # Release already exists. Unlike the other marketplaces, the Eclipse
  # Marketplace does NOT host the artifact: a listing merely points at a p2
  # update-site URL. So "publishing" here means (a) attaching the installable
  # update-site zip to the GitHub Release, and (b) deploying the live update
  # site to GitHub Pages for the Marketplace listing to reference. See
  # eclipse/BUILD.md. Tycho is cross-platform, so this runs on a stock
  # ubuntu-latest runner (it needs network access to the Eclipse p2 repos).
  # -------------------------------------------------------------------------
  build-eclipse-plugin:
    needs: release
    runs-on: ubuntu-latest
    if: success() || needs.release.result == 'success'

    env:
      NEW_VERSION: ${{ needs.release.outputs.new_version }}
      TYCHO_VERSION: '4.0.8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build shared web assets for the Eclipse plugin
        run: |
          npm install
          npm run build:core
          npm run build:webview
          npm run build:eclipse-assets

      - name: Patch version across the Eclipse reactor (POMs, MANIFEST, feature)
        run: |
          mvn -B -f eclipse/pom.xml \
            org.eclipse.tycho:tycho-versions-plugin:${TYCHO_VERSION}:set-version \
            -DnewVersion="${NEW_VERSION}"
          echo "Patched eclipse/ reactor to ${NEW_VERSION}"

      - name: Build the Eclipse plugin, feature and p2 update site
        run: mvn -B -f eclipse/pom.xml clean package

      - name: Stage the update-site zip
        id: stage
        run: |
          mkdir -p dist/installers
          zip=$(ls eclipse/com.hunkontech.revgraph.repository/target/*.zip | head -n1)
          if [ -z "$zip" ]; then
            echo "No p2 repository zip was produced" >&2
            exit 1
          fi
          cp "$zip" dist/installers/RevisionGraph-eclipse-updatesite.zip
          echo "Update site -> RevisionGraph-eclipse-updatesite.zip"

      - name: Attach the update site to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${NEW_VERSION}" \
            dist/installers/RevisionGraph-eclipse-updatesite.zip --clobber

      # Deploy the live p2 update site to GitHub Pages under /eclipse-update-site
      # so the Eclipse Marketplace listing can point at a stable URL. Best-effort
      # (keep_files preserves the demo at the Pages root); a Pages misconfig must
      # not fail a release whose installable zip is already attached above.
      - name: Publish the update site to GitHub Pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: eclipse/com.hunkontech.revgraph.repository/target/repository
          destination_dir: eclipse-update-site
          keep_files: true

  # -------------------------------------------------------------------------
  # Sixth host: build the Apache NetBeans plugin (NetBeans module / Maven +
  # nbm-maven-plugin). The module is written in Kotlin and REUSES the shared,
  # IDE-agnostic git/DTO Kotlin straight from the JetBrains host
  # (jetbrains/common/.../git + model) — only the NetBeans platform glue is its
  # own (see netbeans/pom.xml's kotlin-maven-plugin sourceDirs). Independent of
  # the VS, JetBrains and Eclipse jobs — runs in parallel, also after `release`
  # so the GitHub Release already exists. Tycho-like, the build is cross-platform
  # so it runs on stock ubuntu-latest (JDK 17 via setup-java, which bundles
  # Maven).
  #
  # Publishing note: unlike the JetBrains Marketplace, the Apache NetBeans Plugin
  # Portal has no token-based push API — it only lists plugins hosted on Maven
  # Central and requires a one-time manual "Add Plugin" registration cleared by
  # two verifiers. So there is no token to publish with. End-user AUTO-UPDATE is
  # instead delivered the NetBeans-native way — via an Autoupdate Center: the
  # `autoupdate` goal emits an updates.xml catalog (+ the .nbm) into
  # netbeans/target/netbeans_site/, which we deploy to GitHub Pages under
  # /netbeans-update-center (exactly the Eclipse p2-update-site pattern). A user
  # who adds that catalog URL once in Tools ▸ Plugins ▸ Settings gets updates
  # automatically. "Publishing" here therefore means (a) attaching the
  # sideloadable .nbm to the GitHub Release, and (b) deploying the update center
  # to GitHub Pages. Uses only the existing GITHUB_TOKEN — NO new secret. The
  # Plugin Portal listing remains a documented one-time manual step (see
  # netbeans/BUILD.md).
  # -------------------------------------------------------------------------
  build-netbeans-plugin:
    needs: release
    runs-on: ubuntu-latest
    if: success() || needs.release.result == 'success'

    env:
      NEW_VERSION: ${{ needs.release.outputs.new_version }}
      # Opt-in Maven Central publish (feeds the NetBeans Plugin Portal listing).
      # Empty when the secret is unset, which skips the publish step below — so
      # the .nbm + Autoupdate Center still build/deploy without any credentials.
      MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
      MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build shared web assets for the NetBeans plugin
        run: |
          npm install
          npm run build:core
          npm run build:webview
          npm run build:netbeans-assets

      - name: Patch version in netbeans/pom.xml
        run: |
          mvn -B -f netbeans/pom.xml versions:set \
            -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false
          echo "Patched netbeans/pom.xml to ${NEW_VERSION}"

      # `package` also runs the nbm-maven-plugin `autoupdate` execution (bound to
      # the package phase in netbeans/pom.xml), so this one command produces both
      # the .nbm and the Autoupdate Center under netbeans/target/netbeans_site/.
      - name: Build the NetBeans module (.nbm) + Autoupdate Center
        run: mvn -B -f netbeans/pom.xml -DskipTests clean package

      - name: Stage the .nbm
        run: |
          mkdir -p dist/installers
          nbm=$(ls netbeans/target/*.nbm | head -n1)
          if [ -z "$nbm" ]; then
            echo "No .nbm was produced" >&2
            exit 1
          fi
          cp "$nbm" dist/installers/RevisionGraph-netbeans.nbm
          echo "NetBeans plugin -> RevisionGraph-netbeans.nbm"

      - name: Attach the .nbm to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${NEW_VERSION}" \
            dist/installers/RevisionGraph-netbeans.nbm --clobber

      # Deploy the NetBeans Autoupdate Center (updates.xml + .nbm) to GitHub Pages
      # under /netbeans-update-center so an IDE subscribed to that catalog URL
      # auto-updates the plugin — the NetBeans analogue of the Eclipse update-site
      # deploy above. Best-effort (keep_files preserves the demo at the Pages root
      # and the sibling eclipse-update-site); a Pages misconfig must not fail a
      # release whose .nbm is already attached to the GitHub Release above.
      - name: Publish the Autoupdate Center to GitHub Pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: netbeans/target/netbeans_site
          destination_dir: netbeans-update-center
          keep_files: true

      # -----------------------------------------------------------------------
      # Opt-in: deploy the signed module to Maven Central (Sonatype Central
      # Portal). This is what makes the plugin eligible for the Apache NetBeans
      # Plugin Portal (which only lists Maven-Central-hosted plugins — there is
      # no direct .nbm upload / push token for the Portal itself). Runs only when
      # the MAVENCENTRAL_USERNAME secret is set (guarded by the job-level env),
      # so credential-less builds still succeed. After a successful deploy the
      # release sits "validated" in the Central UI for a manual Publish click
      # (autoPublish=false in the central-deploy profile); the Portal "Add Plugin"
      # + two-verifier approval is a documented one-time manual step (BUILD.md).
      # -----------------------------------------------------------------------
      # Best-effort, like every other optional publish in this workflow: the
      # primary deliverables (the .nbm on the GitHub Release + the Autoupdate
      # Center on GitHub Pages) already shipped in the steps above, so a Maven
      # Central hiccup (e.g. a 401 from a wrong/expired user token) must not fail
      # the whole release. The error still prints in the log for diagnosis.
      - name: Publish NetBeans module to Maven Central
        if: ${{ env.MAVENCENTRAL_USERNAME != '' }}
        continue-on-error: true
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # Best-effort: never fail the step (no red X). Any failure below is
          # turned into a ::warning:: and the step exits 0 — the .nbm and the
          # Autoupdate Center already shipped in the steps above.
          set -uo pipefail

          # 1. Import the GPG signing key (ASCII-armored private key secret).
          if ! echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import; then
            echo "::warning::GPG key import failed — skipping Maven Central publish (the .nbm and Autoupdate Center already shipped)."
            exit 0
          fi

          # 2. Write ~/.m2/settings.xml with the Central Portal server creds the
          #    central-publishing-maven-plugin reads (publishingServerId=central).
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVENCENTRAL_USERNAME}</username>
                <password>${env.MAVENCENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

          # 3. Deploy with the opt-in profile. Version was already stamped by the
          #    earlier `versions:set` step, so this deploys v${NEW_VERSION}. A
          #    failure here (e.g. a 401 from a wrong/expired Sonatype user token)
          #    is downgraded to a warning so the release stays green.
          if mvn -B -f netbeans/pom.xml -Pcentral-deploy -DskipTests \
               -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
               deploy; then
            echo "Deployed io.github.benkoncsik:netbeans:${NEW_VERSION} to Maven Central (validated; Publish it in the Central UI, then Add Plugin on the NetBeans Plugin Portal)."
          else
            echo "::warning::Maven Central publish failed (see the Maven log above — commonly a 401 from a wrong/expired Sonatype user token). Continuing; the .nbm on the GitHub Release and the Autoupdate Center on GitHub Pages already shipped."
            exit 0
          fi

  # -------------------------------------------------------------------------
  # Buffer release announcement (X / Twitter)
  # -------------------------------------------------------------------------
  post-to-buffer:
    if: ${{ needs.release.result == 'success' && github.event_name == 'push' }}
    needs:
      - release
      - build-vs-vsix
      - build-jetbrains-plugins
      - build-netbeans-plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Post release announcement via Buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_CHANNEL_NAME: ${{ secrets.BUFFER_CHANNEL_NAME }}
          BUFFER_CHANNEL_SERVICE: ${{ secrets.BUFFER_CHANNEL_SERVICE }}
          BUFFER_POST_MODE: ${{ secrets.BUFFER_POST_MODE }}
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
          BUFFER_POST_TEMPLATE: |
            Git Revision Graph — TortoiseSVN-style Git history for VS Code & Visual Studio. Branches, commits & tags as connected boxes; right-click any commit to branch, using native Git. New build! 🚀

            {release_url}
        run: |
          python3 scripts/post_buffer_release.py \
            --app-name "Git Revision Graph" \
            --tag "v${NEW_VERSION}" \
            --release-url "https://github.com/HunKonTech/git_Revision_Graph/releases/tag/v${NEW_VERSION}"
