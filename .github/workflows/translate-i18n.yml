# Auto-translates the shared webview i18n dictionary on every push.
#
# This workflow ALWAYS runs to completion on every push (no `paths:` filter), so
# it can act as the single entry point of the release chain: "Build & Publish
# Extensions" (release.yml) is triggered by this workflow's completion via
# `workflow_run`, and "Deploy demo" chains off that in turn. When a push does not
# touch i18n.ts / the translator, the "Decide whether translation is needed" step
# below short-circuits the heavy work but the workflow still finishes green so the
# downstream release fires.
#
# The KO_language_translator Python script (KO_language_translator/main.py) reads
# the `const DICTS` object in packages/graph-webview/src/i18n.ts, takes `en` as
# the source of truth, fills in every other language via Google Translate and
# rewrites only that object. `en` and `hu` are hand-maintained, so both are
# excluded here (`en` is also the translation source).
#
# After the run, any change to i18n.ts is committed straight back to the branch
# that was pushed. The auto-commit carries `[skip ci]` so it cannot retrigger
# this workflow (or any other) — no infinite loop.
#
# Runner selection follows the same "declared, not detected" pattern as
# release.yml / deploy-demo.yml: the script is fully platform-independent, so
# point the RUNNER_TRANSLATE repository variable at whatever self-hosted fleet is
# up (Linux, Windows or macOS) and it runs there; leave it empty (the default)
# and it runs on a GitHub-hosted runner so nothing can ever get stuck queued.
#   gh variable set RUNNER_TRANSLATE --body '["self-hosted","macOS"]'
#   gh variable delete RUNNER_TRANSLATE   # back to GitHub-hosted
# A self-hosted runner used here needs `python3` (>=3.9) and `bash` on PATH;
# GitHub-hosted runners have both. `en` and `hu` are hand-maintained and are
# always excluded from translation.
name: Translate i18n

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Translation mode"
        type: choice
        default: new-only
        options: [new-only, force]

permissions:
  contents: write

# One translation run per branch at a time; a newer push supersedes an
# in-flight run so the branch ends up translated against its latest i18n.ts.
concurrency:
  group: translate-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runners:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - id: pick
        env:
          RUNNER_TRANSLATE: ${{ vars.RUNNER_TRANSLATE }}
        run: |
          set -euo pipefail
          target="${RUNNER_TRANSLATE:-}"
          [ -n "$target" ] || target='["ubuntu-latest"]'
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Translate job -> $target"

  translate:
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.target) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Need a real ref (not detached HEAD) so we can commit + push back.
          ref: ${{ github.ref_name }}
          # Full history so the "Decide whether translation is needed" diff and
          # the push-back rebase have something to work with.
          fetch-depth: 0

      # This workflow runs on every push. Only actually translate when the push
      # touched i18n.ts, the translator, or this workflow — otherwise skip the
      # heavy steps below but still finish green so release.yml's `workflow_run`
      # trigger fires.
      - name: Decide whether translation is needed
        id: need
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "First push / unknown base — translating to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" \
               | grep -qE '^(packages/graph-webview/src/i18n\.ts|KO_language_translator/|\.github/workflows/translate-i18n\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "i18n.ts / translator unchanged in this push — skipping translation; workflow still completes so the release chain fires."
          fi

      # Prefer the Python already on the runner (self-hosted fleets have it, and
      # actions/setup-python's binary install is flaky on some self-hosted
      # Windows runners). Only fall back to setup-python when none is present.
      - name: Locate Python
        id: py
        if: steps.need.outputs.run == 'true'
        run: |
          for c in python3 python; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "bin=$c" >> "$GITHUB_OUTPUT"; echo "Using $($c --version) at $(command -v $c)"; exit 0
            fi
          done
          echo "bin=" >> "$GITHUB_OUTPUT"; echo "No Python on runner; will set one up."
      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == 'true' && steps.py.outputs.bin == ''
        with:
          python-version: "3.12"
      - name: Resolve interpreter
        id: interp
        if: steps.need.outputs.run == 'true'
        run: echo "bin=${{ steps.py.outputs.bin || 'python' }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.need.outputs.run == 'true'
        run: |
          PY='${{ steps.interp.outputs.bin }}'
          "$PY" -m pip install --upgrade deep-translator \
            || "$PY" -m pip install --upgrade --break-system-packages deep-translator

      - name: Translate i18n.ts
        if: steps.need.outputs.run == 'true'
        env:
          MODE: ${{ github.event.inputs.mode || 'new-only' }}
          PY: ${{ steps.interp.outputs.bin }}
        run: |
          "$PY" KO_language_translator/main.py \
            "--${MODE}" \
            --i18n-file "${{ github.workspace }}/packages/graph-webview/src/i18n.ts" \
            --exclude-languages "hu,en" \
            --workers 4

      - name: Commit & push updated translations
        if: steps.need.outputs.run == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/graph-webview/src/i18n.ts; then
            echo "No translation changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/graph-webview/src/i18n.ts
          git commit -m "Auto-translate i18n dictionary [skip ci]"
          # Another push to the same branch may race us; rebase and retry so
          # whichever lands second still applies. The release workflow waits for
          # this run to finish before it builds.
          for attempt in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin ${{ github.ref_name }}
          done
          echo "::warning::could not push translation commit after 3 attempts"
