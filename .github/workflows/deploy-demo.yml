# Builds the interactive browser demo (shared webview bundle + mock data) and
# publishes it to GitHub Pages.
#
# It runs AFTER the "Build & Publish Extensions" (release) workflow finishes, not
# directly on push. That release run bumps the EXTENSION_VERSION repo variable,
# so by the time this starts the version is final — the demo footer shows the
# real current release (vX.Y.Z), never a stale placeholder, and there is no race
# with the version bump. Sequencing after the release also keeps the demo build
# from contending with it: the release runs on the self-hosted *Windows* runner,
# while this runs on the self-hosted *Linux* runner (a different machine), so
# they never fight for the same host (the old push-triggered demo build shared
# the Windows runner and got canceled mid-run).
#
# Everything here runs on self-hosted runners only (org policy). The demo build
# is plain Node + esbuild — no Windows/VS SDK — so the self-hosted Linux runner
# fits and needs no Git-Bash-over-WSL workaround (bash + tar are native there).
#
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions". Then the demo is live at:
#   https://hunkontech.github.io/git_Revision_Graph/
name: Deploy demo to GitHub Pages

on:
  workflow_run:
    workflows: ["Build & Publish Extensions"]
    types: [completed]
  # Manual re-deploy (e.g. after changing this workflow) without a release.
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; newer runs cancel an in-flight one so the live demo
# always ends up on the most recent release.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy only for a successful release (skip when it failed or was
    # cancelled), or when triggered by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Self-hosted Linux (the org's ARM64 Linux runner) — separate machine from
    # the release build's self-hosted Windows runner, so no contention.
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm`: on the memory-constrained self-hosted runners the
      # actions/cache restore can fail to allocate its download buffer and hang
      # before falling through, so npm's own cache is left to do the job.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        # The real current-release version lives in the EXTENSION_VERSION repo
        # variable (bumped by the release workflow that just finished); the
        # committed package.json only carries a placeholder. Inject it so the
        # footer matches the latest release. Falls back to package.json when the
        # variable is unset (e.g. a fresh fork).
        env:
          APP_VERSION: ${{ vars.EXTENSION_VERSION }}
        run: npm run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo

  deploy:
    needs: build
    # deploy-pages just calls the Pages REST API; run it on the same self-hosted
    # Linux runner (org policy allows self-hosted only).
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
