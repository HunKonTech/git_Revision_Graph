# Builds the interactive browser demo (shared webview bundle + mock data) and
# publishes it to GitHub Pages.
#
# It runs AFTER the "Build & Publish Extensions" (release) workflow finishes, not
# directly on push. That release run bumps the EXTENSION_VERSION repo variable,
# so by the time this starts the version is final — the demo footer shows the
# real current release (vX.Y.Z), never a stale placeholder, and there is no race
# with the version bump. Running here also keeps the demo build off the
# self-hosted Windows runner while the heavy release build occupies it (the old
# push-triggered demo build contended with it and got canceled mid-run).
#
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions". Then the demo is live at:
#   https://hunkontech.github.io/git_Revision_Graph/
name: Deploy demo to GitHub Pages

on:
  workflow_run:
    workflows: ["Build & Publish Extensions"]
    types: [completed]
  # Manual re-deploy (e.g. after changing this workflow) without a release.
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; newer runs cancel an in-flight one so the live demo
# always ends up on the most recent release.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy only for a successful release (skip when it failed or was
    # cancelled), or when triggered by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # GitHub-hosted: the demo build is plain Node + esbuild (no Windows/VS SDK),
    # so it needs neither the self-hosted runner nor its Git-Bash-over-WSL fix,
    # and it can't contend with the release build for that machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        # The real current-release version lives in the EXTENSION_VERSION repo
        # variable (bumped by the release workflow that just finished); the
        # committed package.json only carries a placeholder. Inject it so the
        # footer matches the latest release. Falls back to package.json when the
        # variable is unset (e.g. a fresh fork).
        env:
          APP_VERSION: ${{ vars.EXTENSION_VERSION }}
        run: npm run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
